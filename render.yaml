# Render Blueprint for the Kinetiq v4 monorepo — BOTH services in one file.
# Render auto-detects this at the repo root when you connect the repo as a "Blueprint".
#
# See docs/DEPLOY_RUNBOOK.md for the ordered wiring steps (they're chicken-and-egg: each service
# needs the other's URL). Every dashboard action is yours — nothing here provisions an account.
services:
  # 1) Detector API — Docker web service. Build context is the repo root (the Dockerfile header
  #    explains why: the detector's imports need evals/gate0/, backend/app/core/, exercises/ at
  #    their real relative layout). No pose runtime in this image — it scores keypoints only.
  - type: web
    name: kinetiq-v4-api
    runtime: docker
    dockerfilePath: ./evals/gate0/prototype_api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PROTOTYPE_API_CORS_ORIGINS
        sync: false
        # Set in the dashboard to the PWA's exact deployed HTTPS origin (below), e.g.
        # https://kinetiq-v4-pwa.onrender.com — NOT "*", no trailing slash, no path.

  # 2) Camera PWA — static site. No build step; just serve frontend/. Static sites don't spin down.
  #    Before deploying, point frontend/config.js API_BASE_URL at the API URL from service 1
  #    (frontend/set-api-url.ps1 does this), commit, then deploy.
  - type: web
    name: kinetiq-v4-pwa
    runtime: static
    staticPublishPath: ./frontend
    buildCommand: ""
    # SPA-style not needed (multi-screen single page); default static serving is fine.
